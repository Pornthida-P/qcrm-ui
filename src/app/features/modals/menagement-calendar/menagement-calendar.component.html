<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-2">{{ title | uppercase }}({{ data.mode | uppercase }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-2" [icon]="faXmark"></fa-icon>
            </a>
        </div>
        <form class="col-12" [formGroup]="calendarEvent">
            <div class="my-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" formControlName="title" name="title" required />
            </div>

            <div class="row my-3">
                <div class="col-sm-12 col-md-6">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" formControlName="location" name="location" />
                </div>

                <div class="col-sm-12 col-md-6">
                    <label for="datepicker" class="form-label">Date and Time</label>
                    <div class="input-group">
                        <input
                            matInput
                            [matDatepicker]="picker"
                            formControlName="datetime"
                            name="datetime"
                            required
                            class="input-date form-control"
                        />
                        <span class="input-group-text">
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                        </span>
                    </div>
                </div>
            </div>

            <div class="my-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" formControlName="description" name="description" rows="5"></textarea>
            </div>

            <div class="my-3">
                <label for="members" class="form-label">Members</label>
                <mat-select
                    class="form-control"
                    formControlName="members"
                    (selectionChange)="onMemberSelectionChange($event)"
                    name="members"
                    multiple
                >
                    <mat-option *ngFor="let member of members" [value]="member">
                        <div class="d-flex align-items-center justify-content-between gap-3 p-3">
                            <app-profile-list [member]="member"></app-profile-list>
                        </div>
                    </mat-option>
                </mat-select>

                <div *ngIf="selectedMembers.length > 0" class="members py-3">
                    <div class="row">
                        <div *ngFor="let member of selectedMembers" class="col-12 mb-3">
                            <div class="d-flex align-items-center justify-content-between gap-3 p-3 bg-light">
                                <app-profile-list [member]="member"></app-profile-list>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <button type="submit" class="btn btn-primary-color text-white" (click)="onSubmit()">Save</button>
            </div>
        </form>
    </div>
</div>
