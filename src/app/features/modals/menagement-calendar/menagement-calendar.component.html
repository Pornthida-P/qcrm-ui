<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-5">{{ 'title.' + title | translate }}({{ 'mode.' + data.mode | translate }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-5" [icon]="faXmark"></fa-icon>
            </a>
        </div>

        <div class="col-12 py-3">
            <ul class="nav nav-tabs" id="calendarEventTab">
                <li class="nav-item">
                    <a class="nav-link active color-primary" id="details-tab" data-bs-toggle="tab" href="#details">{{
                        'modal.calendar.menuDetail' | translate
                    }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link color-primary" id="attachments-tab" data-bs-toggle="tab" href="#attachments">
                        {{ 'modal.calendar.menuAttachments' | translate }}
                    </a>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="details">
                    <div class="row">
                        <form class="col-12" [formGroup]="calendarEvent">
                            <div class="my-3">
                                <label for="title" class="form-label">
                                    {{ 'modal.calendar.title' | translate }}
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="title"
                                    formControlName="title"
                                    name="title"
                                    required
                                    [ngClass]="{
                                        'invalid-form':
                                            calendarEvent.get('title')?.invalid &&
                                            (calendarEvent.get('title')?.dirty || calendarEvent.get('title')?.touched)
                                    }"
                                />
                            </div>

                            <!-- <div class="row my-3"> //NOTE - tag
                                <div class="col-sm-12 col-md-12">
                                    <label for="tag" class="form-label">
                                        {{ 'modal.calendar.tag' | translate }}
                                    </label>
                                    <select
                                        class="form-select"
                                        id="tag"
                                        formControlName="tag"
                                        name="tag"
                                        [ngClass]="{
                                            'invalid-form':
                                                calendarEvent.get('tag')?.invalid &&
                                                (calendarEvent.get('tag')?.dirty || calendarEvent.get('tag')?.touched)
                                        }"
                                    >
                                        <option *ngFor="let tag of tags" [value]="tag.tagId">{{ tag.tagName }}</option>
                                    </select>
                                </div>
                            </div> -->

                            <!-- <div class="row my-3">
                                <div class="col-sm-12 col-md-12">
                                    <label for="location" class="form-label">
                                        {{ 'modal.calendar.location' | translate }}
                                    </label>
                                    <input type="text" class="form-control" id="location" formControlName="location" name="location" />
                                </div>
                            </div> -->

                            <div class="row">
                                <div class="col-sm-12 col-md-6">
                                    <label for="startDate" class="label">
                                        {{ 'modal.calendar.startDate' | translate }}
                                    </label>
                                    <div class="row justify-content-center align-items-center">
                                        <div class="col">
                                            <div class="input-group start-date">
                                                <input
                                                    matInput
                                                    [matDatepicker]="startDatePicker"
                                                    formControlName="startDate"
                                                    name="datetime"
                                                    required
                                                    class="input-date form-control"
                                                />
                                                <span class="input-group-text">
                                                    <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
                                                    <mat-datepicker #startDatePicker></mat-datepicker>
                                                </span>
                                            </div>
                                        </div>

                                        <div class="col">
                                            <ngb-timepicker
                                                class="starttime"
                                                [(ngModel)]="startTime"
                                                [seconds]="true"
                                                [ngModelOptions]="{ standalone: true }"
                                                [disabled]="data.mode === 'view'"
                                            ></ngb-timepicker>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-12 col-md-6">
                                    <label for="endDate" class="label">
                                        {{ 'modal.calendar.endDate' | translate }}
                                    </label>
                                    <div class="row justify-content-center align-items-center">
                                        <div class="col">
                                            <div class="input-group end-date">
                                                <input
                                                    matInput
                                                    [matDatepicker]="endDatePicker"
                                                    formControlName="endDate"
                                                    name="datetime"
                                                    required
                                                    class="input-date form-control"
                                                />
                                                <span class="input-group-text">
                                                    <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
                                                    <mat-datepicker #endDatePicker></mat-datepicker>
                                                </span>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <ngb-timepicker
                                                class="endtime"
                                                [(ngModel)]="endTime"
                                                [seconds]="true"
                                                [ngModelOptions]="{ standalone: true }"
                                                [disabled]="data.mode === 'view'"
                                            ></ngb-timepicker>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="my-3">
                                <label for="description" class="form-label">
                                    {{ 'modal.calendar.description' | translate }}
                                </label>
                                <angular-editor formControlName="description" [config]="editorConfig"></angular-editor>
                            </div>

                            <!-- <div class="my-3"> //NOTE - member
                                <label for="members" class="form-label">
                                    {{ 'modal.calendar.members' | translate }}
                                </label>
                                <mat-select
                                    class="form-control"
                                    formControlName="members"
                                    (selectionChange)="onMemberSelectionChange($event)"
                                    name="members"
                                    multiple
                                    [ngClass]="{
                                        'invalid-form':
                                            calendarEvent.get('members')?.invalid &&
                                            (calendarEvent.get('members')?.dirty || calendarEvent.get('members')?.touched)
                                    }"
                                >
                                    <mat-option class="bg-light" *ngFor="let member of members" [value]="member">
                                        <app-profile [member]="member"></app-profile>
                                    </mat-option>
                                </mat-select>

                                <div *ngIf="selectedMembers.length > 0" class="members my-2">
                                    <div class="row">
                                        <app-profile-list
                                            [members]="selectedMembers"
                                            [isShowToolbar]="true"
                                            [isBackground]="false"
                                            [mode]="data.mode"
                                            (deleteUserId)="onDeletedMember($event)"
                                        ></app-profile-list>
                                    </div>
                                </div>
                            </div> -->
                        </form>
                    </div>
                </div>
                <div class="tab-pane fade" id="attachments">
                    <div class="row align-items-center my-3">
                        <div class="col">
                            <label for="attachments" class="form-label">
                                {{ 'modal.calendar.attachments' | translate }}
                            </label>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary-color text-white" (click)="openFileInput()" [disabled]="data.mode === 'view'">
                                <fa-icon [icon]="faPlus"></fa-icon>
                                {{ 'modal.calendar.add' | translate }}
                            </button>
                            <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" />
                        </div>
                    </div>
                    <div class="row my-3">
                        <div class="col">
                            <app-attachments-list
                                [attachments]="attachments"
                                [isShowToolbar]="true"
                                [mode]="data.mode"
                            ></app-attachments-list>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <button type="submit" class="btn btn-primary-color text-white" (click)="onSubmit()" [disabled]="data.mode === 'view'">
                {{ 'modal.calendar.save' | translate }}
            </button>
        </div>
    </div>
</div>
