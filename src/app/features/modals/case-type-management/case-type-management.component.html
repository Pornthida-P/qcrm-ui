<div class="case-type-modal">
    <!-- Header -->
    <div class="modal-header-section">
        <div class="row align-items-center">
            <div class="col-12 col-md-8">
                <h5 class="modal-title mb-0">
                    {{ 'title.' + title | translate }}
                    <span class="badge bg-secondary ms-2">{{ 'mode.' + data.mode | translate }}</span>
                </h5>
            </div>
            <div class="col-12 col-md-4 text-end mt-2 mt-md-0">
                <button type="button" class="btn-close-modal" (click)="onClickClose()" aria-label="Close">
                    <fa-icon [icon]="faXmark"></fa-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="modal-content-section">
        <form [formGroup]="caseTypeForm" (ngSubmit)="saveCaseType()">
            <div class="form-section">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="name" class="form-label"
                            >{{ 'form.name' | translate }} <span class="text-danger">*</span></label
                        >
                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            formControlName="name"
                            [readonly]="data.mode === 'view'"
                            [class.is-invalid]="caseTypeForm.get('name')?.invalid && caseTypeForm.get('name')?.touched"
                        />
                        <div
                            class="invalid-feedback"
                            *ngIf="caseTypeForm.get('name')?.invalid && caseTypeForm.get('name')?.touched"
                        >
                            {{ 'form.nameRequired' | translate }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="modal-actions" *ngIf="data.mode !== 'view'">
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" (click)="onClickClose()">
                        {{ 'common.cancel' | translate }}
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="caseTypeForm.invalid">
                        {{ 'common.save' | translate }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
