<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-5">{{ 'title.' + title | translate }}({{ 'mode.' + data.mode | translate }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-5" [icon]="faXmark"></fa-icon>
            </a>
        </div>

        <div class="col-12">
            <form [formGroup]="tagData" (ngSubmit)="onSubmit()">
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="tagName">
                        {{ 'modal.tag.tagName' | translate }}
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="tagName"
                        id="tagName"
                        name="tagName"
                        required
                        [ngClass]="{
                            'invalid-form':
                                tagData.get('tagName')?.invalid && (tagData.get('tagName')?.dirty || tagData.get('tagName')?.touched)
                        }"
                    />
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="description">
                        {{ 'modal.tag.description' | translate }}
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="description"
                        id="description"
                        name="description"
                        required
                        [ngClass]="{
                            'invalid-form':
                                tagData.get('description')?.invalid &&
                                (tagData.get('description')?.dirty || tagData.get('description')?.touched)
                        }"
                    />
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="color">
                        {{ 'modal.tag.color' | translate }}
                    </label>
                    <input
                        type="color"
                        class="form-control"
                        formControlName="color"
                        id="color"
                        name="color"
                        required
                        [ngClass]="{
                            'invalid-form': tagData.get('color')?.invalid && (tagData.get('color')?.dirty || tagData.get('color')?.touched)
                        }"
                    />
                </div>

                <div class="form-group px-3 py-2">
                    <button type="submit" class="btn btn-primary-color text-white" [disabled]="data.mode === 'view'">
                        {{ 'modal.tag.save' | translate }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
