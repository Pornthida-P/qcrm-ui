<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-5">{{ title | uppercase }}({{ data.mode | uppercase }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-5" [icon]="faXmark"></fa-icon>
            </a>
        </div>

        <div class="row">
            <div class="col-12">
                <form [formGroup]="tagData">
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="tagName">Tag Title</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="tagName"
                            id="tagName"
                            name="tagName"
                            required
                            [ngClass]="{
                                'invalid-form':
                                    tagData.get('tagName')?.invalid && (tagData.get('tagName')?.dirty || tagData.get('tagName')?.touched)
                            }"
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="description">Description</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="description"
                            id="description"
                            name="description"
                            required
                            [ngClass]="{
                                'invalid-form':
                                    tagData.get('description')?.invalid &&
                                    (tagData.get('description')?.dirty || tagData.get('description')?.touched)
                            }"
                        />
                    </div>

                    <div class="footer">
                        <button
                            type="submit"
                            class="btn btn-primary-color text-white"
                            (click)="onSubmit()"
                            [disabled]="data.mode === 'view'"
                        >
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
