<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-2">{{ title | uppercase }}({{ data.mode | uppercase }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-2" [icon]="faXmark"></fa-icon>
            </a>
        </div>

        <div class="row">
            <div class="col-md-7 px-4 pt-2 pb-4">
                <form [formGroup]="userData">
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="userId">User Id</label>
                        <input
                            type="userId"
                            class="form-control"
                            formControlName="userId"
                            id="userId"
                            name="userId"
                            required
                            [readonly]="data.mode !== 'add'"
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="username">Username</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="username"
                            id="username"
                            name="username"
                            required
                            [readonly]="data.mode !== 'add'"
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="role">Role</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="role"
                            id="role"
                            name="role"
                            required
                            [readonly]="data.mode !== 'add'"
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="email">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            formControlName="email"
                            id="email"
                            name="email"
                            required
                            [readonly]="data.mode !== 'add'"
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="group">Group</label>
                        <input
                            type="group"
                            class="form-control"
                            formControlName="group"
                            id="group"
                            name="group"
                            required
                            [readonly]="data.mode !== 'add'"
                        />
                    </div>
                </form>
            </div>
            <div class="col-md-5 px-4 pt-2 pb-4">
                <div class="card h-100 py-3">
                    <div class="profile m-auto">
                        <img
                            class="profile-image img-fluid"
                            [src]="data.userData?.profile"
                            [alt]="data.userData?.username"
                            (error)="handleProfileError($event)"
                        />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
