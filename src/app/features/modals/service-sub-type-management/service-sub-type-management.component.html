<div class="service-sub-type-modal">
    <!-- Header -->
    <div class="modal-header-section">
        <div class="row align-items-center">
            <div class="col-12 col-md-8">
                <h5 class="modal-title mb-0">
                    {{ 'title.' + title | translate }}
                    <span class="badge bg-secondary ms-2">{{ 'mode.' + data.mode | translate }}</span>
                </h5>
            </div>
            <div class="col-12 col-md-4 text-end mt-2 mt-md-0">
                <button type="button" class="btn-close-modal" (click)="onClickClose()" aria-label="Close">
                    <fa-icon [icon]="faXmark"></fa-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="modal-content-section">
        <form [formGroup]="serviceSubTypeForm" (ngSubmit)="saveServiceSubType()">
            <div class="form-section">
                <div class="row g-3">
                    <div class="col-12" *ngIf="data.mode === 'add'">
                        <div class="alert alert-info mb-0">
                            {{ 'page.service-sub-type.bindHint' | translate }}
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="name" class="form-label">{{ 'form.name' | translate }} <span class="text-danger">*</span></label>
                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            formControlName="name"
                            [readonly]="data.mode === 'view'"
                            [class.is-invalid]="serviceSubTypeForm.get('name')?.invalid && serviceSubTypeForm.get('name')?.touched"
                        />
                        <div
                            class="invalid-feedback"
                            *ngIf="serviceSubTypeForm.get('name')?.invalid && serviceSubTypeForm.get('name')?.touched"
                        >
                            {{ 'form.nameRequired' | translate }}
                        </div>
                    </div>
                    <div class="col-12" *ngIf="data.mode !== 'add'">
                        <label class="form-label">{{ 'page.service-sub-type.linkedServiceTypes' | translate }}</label>
                        <div *ngIf="linkedServiceTypes.length > 0" class="linked-type-list">
                            <span class="badge bg-light text-dark border me-1 mb-1" *ngFor="let typeName of linkedServiceTypes">
                                {{ typeName }}
                            </span>
                        </div>
                        <div *ngIf="!isLoadingLinkedTypes && linkedServiceTypes.length === 0" class="text-muted small">
                            {{ 'page.service-sub-type.noLinkedServiceTypes' | translate }}
                        </div>
                        <div class="form-text" *ngIf="data.mode === 'edit'">
                            {{ 'page.service-sub-type.bindHintEdit' | translate }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="modal-actions" *ngIf="data.mode !== 'view'">
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" (click)="onClickClose()">
                        {{ 'common.cancel' | translate }}
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="serviceSubTypeForm.invalid">
                        {{ 'common.save' | translate }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
