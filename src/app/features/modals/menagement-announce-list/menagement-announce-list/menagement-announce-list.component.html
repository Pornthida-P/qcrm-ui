<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-2">{{ title | uppercase }}</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-2" [icon]="faXmark"></fa-icon>
            </a>
        </div>
        <div class="col-12 p-3" *ngIf="announcements && announcements.length > 0; else noData">
            <table mat-table [dataSource]="announcements" class="mat-elevation">
                <ng-container matColumnDef="announceTitle">
                    <th mat-header-cell *matHeaderCellDef class="fs-5">Title</th>
                    <td mat-cell *matCellDef="let announcement">{{ announcement?.announceTitle }}</td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef class="fs-5">Description</th>
                    <td mat-cell *matCellDef="let announcement">{{ announcement?.description }}</td>
                </ng-container>

                <ng-container matColumnDef="startDate">
                    <th mat-header-cell *matHeaderCellDef class="fs-5">Start Date</th>
                    <td mat-cell *matCellDef="let announcement">{{ announcement?.startDate | date : 'M/d/yy, h:mm:ss a' }}</td>
                </ng-container>

                <ng-container matColumnDef="endDate">
                    <th mat-header-cell *matHeaderCellDef class="fs-5">End Date</th>
                    <td mat-cell *matCellDef="let announcement">{{ announcement?.endDate | date : 'M/d/yy, h:mm:ss a' }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef class="fs-5">Actions</th>
                    <td mat-cell *matCellDef="let announcement">
                        <button class="btn btn-primary-color text-white mx-1" (click)="onClickViewAnnounce(announcement)">
                            <fa-icon [icon]="faEye"></fa-icon>
                        </button>
                        <button class="btn btn-primary-color text-white mx-1" (click)="onClickEditAnnounce(announcement)">
                            <fa-icon [icon]="faEdit"></fa-icon>
                        </button>
                        <button class="btn btn-red-color text-white mx-1" (click)="onClickDeleteAnnounce(announcement)">
                            <fa-icon [icon]="faXmark"></fa-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="['announceTitle', 'description', 'startDate', 'endDate', 'actions']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['announceTitle', 'description', 'startDate', 'endDate', 'actions']"></tr>
            </table>
        </div>
        <ng-template #noData>
            <div class="row p-4">
                <div class="col-12">
                    <p class="fs-4 label text-center cursor-default">ไม่พบข้อมูล</p>
                </div>
            </div>
        </ng-template>
        <div class="footer d-flex gap-2">
            <button type="button" class="btn btn-primary-color text-white" (click)="onClickAddAnnounce()">Add</button>
            <button type="button" class="btn btn-primary-color text-white" (click)="onSubmit()">Save</button>
        </div>
    </div>
</div>
