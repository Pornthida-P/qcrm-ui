<div class="container">
    <div class="row p-4">
        <div class="col-8">
            <p class="form-label fs-2">{{ title | uppercase }}({{ data.mode | uppercase }})</p>
        </div>
        <div class="col-4 d-flex justify-content-end">
            <a class="color-red cursor-pointer" (click)="onClickClose()">
                <fa-icon class="fs-2" [icon]="faXmark"></fa-icon>
            </a>
        </div>

        <div class="row">
            <div class="col-12">
                <form [formGroup]="announceData">
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="announceTitle">Announce Title</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="announceTitle"
                            id="announceTitle"
                            name="announceTitle"
                            required
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="description">Description</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="description"
                            id="description"
                            name="description"
                            required
                        />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="startDate">Start Date</label>
                        <input type="text" class="form-control" formControlName="startDate" id="startDate" name="startDate" required />
                    </div>
                    <div class="form-group px-3 py-2">
                        <label class="mb-2" for="endDate">End Date</label>
                        <input type="text" class="form-control" formControlName="endDate" id="endDate" name="endDate" required />
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
