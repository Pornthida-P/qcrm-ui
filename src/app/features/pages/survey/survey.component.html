<div class="h-full">
    <div class="bg-white border-round-lg shadow-2 w-full pb-4 h-full">
        <div class="p-4 flex flex-column md:flex-row lg:flex-row gap-4 align-items-center">
            <p class="m-0 text-2xl flex-none">การติดตามประเมินผล</p>
            <div class="flex flex-grow-1 flex-nowrap w-full">
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-search color-primary font-semibold"></i>
                    <input
                        type="text"
                        pInputText
                        [(ngModel)]="value"
                        placeholder="ค้นหา..."
                        ngClass="font-thai w-full border-noround-right"
                    />
                </span>
                <p-dropdown
                    id="survey"
                    [options]="filterOption"
                    [(ngModel)]="selectedFilter"
                    optionLabel="name"
                    [showClear]="false"
                    styleClass="h-full border-noround-left"
                ></p-dropdown>
            </div>
            <p-button
                label="สร้างแบบสำรวจ"
                icon="pi pi-plus"
                class="flex-none flex md:hidden lg:flex"
                styleClass="font-thai btn-color-primary"
            ></p-button>
            <p-button icon="pi pi-plus" class="flex-none hidden md:flex lg:hidden" styleClass="font-thai btn-color-primary"></p-button>
        </div>
        <div>
            <p-table [value]="surveys" [(selection)]="selectedSurvey" dataKey="code" [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 4rem">
                            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                        </th>
                        <th style="width: 12%">เลขที่การทำแบบสำรวจ</th>
                        <th style="width: 15%">ชื่อผู้ติดตามและประเมินผลฯ</th>
                        <th style="width: 40%">แบบฟอร์มสำรวจ</th>
                        <th style="width: 13%">ประจำปี (ค.ศ.)</th>
                        <th style="width: 20%">วันที่บันทึก</th>
                        <th>จัดการ</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-survey>
                    <tr>
                        <td>
                            <p-tableCheckbox [value]="survey"></p-tableCheckbox>
                        </td>
                        <td>{{ survey.no }}</td>
                        <td>{{ survey.name }}</td>
                        <td>
                            <a pTooltip="{{ survey.survey_form }}">{{ survey.survey_form }}</a>
                        </td>
                        <td>{{ survey.year }}</td>
                        <td>{{ survey.save_date }}</td>
                        <td class="text-center"><fa-icon [icon]="faPenToSquare"></fa-icon></td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="7">No data found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
