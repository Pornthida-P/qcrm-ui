<div class="vh-100">
    <div class="px-3 py-2 bg-white border-bottom border-2 border-light-subtle">
        <div class="d-flex flex-row justify-content-between align-items-center">
            <div class="flex-lg-none d-flex flex-row align-items-center me-lg-6">
                <img src="./assets/nea-qcrm-ui/image/logo_CRM.png" class="logo-img" />
            </div>
        </div>
    </div>
    <div class="h-minus-navbar bg-body-tertiary p-5">
        <div
            class="bg-white rounded shadow w-100 h-100 overflow-auto p-4"
            [ngClass]="thanks ? 'd-flex align-content-center justify-content-around align-items-center' : ''"
        >
            <div class="d-flex justify-content-center flex-column" *ngIf="!thanks">
                <p class="pb-4 text-dark fs-5 m-0">แบบสำรวจ : {{ formName }}</p>
                <formio [form]="form" (submit)="onSubmit($event)"></formio>
                <button class="btn-primary-color rounded p-2 text-white mt-2" (click)="submitButton()">บันทึก</button>
            </div>
            <div>
                <div class="d-flex justify-content-center flex-column" *ngIf="thanks">
                    <img src="./assets/nea-qcrm-ui/image/emotional.jpg" class="thanks-img" />
                    <p class="pb-4 text-dark fs-5 m-0 text-center fs-2">ขอบคุณสำหรับการทำแบบสำรวจ</p>
                    <!-- <button class="btn-primary-color rounded p-2 text-white mt-2" (click)="backButton()">กลับ</button> -->
                </div>
            </div>
        </div>
    </div>
</div>
