<div class="">
    <div class="bg-white rounded shadow w-100 h-100">
        <div class="p-4 d-flex flex-column justify-content-between gap-4 w-100">
            <div class="d-flex justify-content-between mg-bt">
                <button type="button" (click)="prev()" class="btn btn-outline-danger">ย้อนกลับ</button>
                <button type="button" (click)="submit()" class="btn btn-primary rounded text-white">บันทึก</button>
            </div>
            <p class="fs-5 mg-bt-0">สร้างข้อมูลการติดต่อ</p>
            <form class="row g-3">
                <!-- ผู้ติดต่อ -->
                <div class="col-12 col-md-6">
                    <label for="inputContact" class="form-label">ผู้ติดต่อ</label>
                    <div
                        class="form-control d-flex align-items-center"
                        (click)="showSideBarContact()"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasRight"
                        style="cursor: pointer; min-height: 38px"
                    >
                        {{ contactName || 'เลือกผู้ติดต่อ...' }}
                    </div>
                </div>

                <!-- หัวข้อที่ติดต่อ -->
                <div class="col-12 col-md-6">
                    <label for="inputTopic" class="form-label">หัวข้อที่ติดต่อ<span class="text-danger">*</span></label>
                    <select
                        id="inputTopic"
                        class="form-select"
                        name="selectedCaseTopics"
                        [(ngModel)]="selectedCaseTopics"
                        (change)="onCaseTopicChange($event)"
                    >
                        <option disabled value="">กรุณาเลือกข้อมูล</option>
                        <option *ngFor="let casetopic of casetopics" [value]="casetopic.caseTopicId">
                            {{ casetopic.code }} - {{ casetopic.name }}
                        </option>
                    </select>
                </div>

                <!-- เรื่องที่ติดต่อ -->
                <div class="col-12 col-md-6">
                    <label for="inputCaseSubject" class="form-label">เรื่องที่ติดต่อ</label>
                    <select id="inputCaseSubject" class="form-select" name="selectedCasesubject" [(ngModel)]="selectedCasesubject">
                        <option disabled value="">กรุณาเลือกข้อมูล</option>
                        <ng-container *ngFor="let casesubject of casesubjects">
                            <option
                                *ngIf="selectedCaseTopics && selectedCaseTopics == casesubject.caseTopicId"
                                [value]="casesubject.caseSubjectId"
                            >
                                {{ casesubject.name }}
                            </option>
                        </ng-container>
                    </select>
                </div>

                <!-- สถานะ -->
                <div class="col-12 col-md-6">
                    <label for="inputStatus" class="form-label">สถานะ</label>
                    <select id="inputStatus" class="form-select" name="selectedStatus" [(ngModel)]="selectedStatus">
                        <option disabled value="">กรุณาเลือกข้อมูล</option>
                        <option *ngFor="let status of statusList" [value]="status.id">{{ status.status }}</option>
                    </select>
                </div>

                <!-- ช่องทางติดต่อ -->
                <div class="col-12 col-md-6">
                    <label for="inputChannel" class="form-label">ช่องทางติดต่อ</label>
                    <select id="inputChannel" class="form-select" name="selectedChannels" [(ngModel)]="selectedChannels">
                        <option disabled value="">กรุณาเลือกข้อมูล</option>
                        <option *ngFor="let channel of channels" [value]="channel.channelId">{{ channel.name }}</option>
                    </select>
                </div>

                <!-- ประเภทสาย/อีเมล -->
                <div class="col-12 col-md-6" *ngIf="selectedChannels === '1' || selectedChannels === '2' || selectedChannels === '3'">
                    <label for="inputCallType" class="form-label">
                        {{ selectedChannels === '3' ? 'ประเภทอีเมล' : 'ประเภทสาย' }}
                    </label>
                    <select id="inputCallType" class="form-select" name="selectedCallTypeId" [(ngModel)]="selectedCallTypeId">
                        <option disabled value="">กรุณาเลือกข้อมูล</option>
                        <option *ngFor="let callType of callTypes" [value]="callType.name">{{ callType.name }}</option>
                    </select>
                </div>

                <!-- เบอร์ติดต่อ -->
                <div class="col-12 col-md-6" *ngIf="selectedChannels === '1' || selectedChannels === '2'">
                    <label for="inputContactNumber" class="form-label">เบอร์ติดต่อ<span class="text-danger">*</span></label>
                    <select id="inputContactNumber" class="form-select" name="selectedContactNumber" [(ngModel)]="selectedContactNumber">
                        <option disabled [ngValue]="null">กรุณาเลือกข้อมูล</option>
                        <option
                            *ngFor="let contactNumbers of contactNumber"
                            [ngValue]="{ contactNumber: contactNumbers.contactNumber, contactNumberId: contactNumbers.contactNumberId }"
                        >
                            {{ contactNumbers.contactNumber }}
                        </option>
                    </select>
                </div>

                <!-- ไฟล์แนบ -->
                <div class="col-12 col-md-6">
                    <label for="formFileSm" class="form-label">ไฟล์แนบ</label>
                    <input class="form-control" id="formFileSm" type="file" multiple (change)="onFileSelected($event)" />
                </div>

                <!-- วันที่และเวลา -->
                <div class="col-12 col-md-6">
                    <label for="inputDateTime" class="form-label">วันที่และเวลา</label>
                    <div class="d-flex flex-wrap gap-1 align-items-center">
                        <div class="input-group" style="width: auto; min-width: 180px">
                            <input
                                matInput
                                [matDatepicker]="picker1"
                                name="startTime"
                                [(ngModel)]="startTime"
                                required
                                class="form-control"
                                placeholder="เลือกวันที่"
                                style="width: 120px"
                            />
                            <span class="input-group-text">
                                <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                                <mat-datepicker #picker1></mat-datepicker>
                            </span>
                        </div>
                        <ngb-timepicker
                            name="timepickStart"
                            [(ngModel)]="timepickStart"
                            [seconds]="seconds"
                            [ngModelOptions]="{ standalone: true }"
                            (ngModelChange)="onTimepickStartChange($event)"
                        ></ngb-timepicker>
                    </div>
                </div>

                <!-- รายละเอียด -->
                <div class="col-12">
                    <label for="floatingTextarea" class="form-label">รายละเอียด</label>
                    <textarea
                        class="form-control"
                        placeholder="กรุณากรอกข้อมูล"
                        id="floatingTextarea"
                        name="description"
                        [(ngModel)]="description"
                        rows="3"
                    ></textarea>
                </div>

                <!-- ความคิดเห็น -->
                <div class="col-12">
                    <label for="floatingTextareaComment" class="form-label">ความคิดเห็น</label>
                    <textarea
                        class="form-control"
                        placeholder="กรุณากรอกข้อมูล"
                        id="floatingTextareaComment"
                        name="comment"
                        [(ngModel)]="comment"
                        rows="3"
                    ></textarea>
                </div>
            </form>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
                <div class="offcanvas-body">
                    <div class="d-flex flex-wrap justify-content-between">
                        <div class="d-flex">
                            <div class="p-2 flex-grow-1" type="button" placement="bottom" ngbTooltip="ปิด">
                                <fa-icon class="" [icon]="faCircleXmark" size="lg" data-bs-dismiss="offcanvas"></fa-icon>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="showContactSidebar">
                        <div class="p-5 shadow call-side-detail" *ngIf="searchContactShowing">
                            <div>
                                <h4>เลือกผู้ติดต่อ</h4>
                                <div class="row search-contact">
                                    <div class="col-md-9">
                                        <input
                                            id="table-complete-search"
                                            type="text"
                                            class="form-control border shadow-none"
                                            name="searchContact"
                                            [(ngModel)]="valuesearchContact"
                                            placeholder="ค้นหา..."
                                            aria-describedby="basic-addon1"
                                            style="width: 100%"
                                            (change)="searchContact()"
                                        />
                                    </div>
                                    <button type="button" class="btn btn-primary btn-search-contact" (click)="searchContact()">
                                        ค้นหา
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 shadow call-side-change-by w-100 h-100 overflow-auto p-4">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th style="width: 70%" scope="col">
                                                <a (click)="sortContact('name')">ชื่อ </a
                                                ><i *ngIf="sortIdContact == 'name'" class="{{ sortIcon }}"></i>
                                            </th>
                                            <th style="width: 15%" scope="col">
                                                <a (click)="sortContact('createdAt')">วันที่บันทึก</a
                                                ><i *ngIf="sortIdContact == 'createdAt'" class="{{ sortIcon }}"></i>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ng-container>
                                            <tr
                                                *ngFor="let contact of contacts; let i = index"
                                                (click)="chooseContact(contact.contactId)"
                                                class="cursor-pointer"
                                                data-bs-dismiss="offcanvas"
                                                data-bs-target="#offcanvasRight"
                                            >
                                                <td scope="row">{{ contact.fullname }}</td>
                                                <td scope="row">{{ contact.createdAt | date : 'dd/MM/yyyy HH:mm' }}</td>
                                            </tr>
                                        </ng-container>
                                        <ng-template #noDataTemplate>
                                            <tr>
                                                <td colspan="4" class="text-center">ไม่มีข้อมูล</td>
                                            </tr>
                                        </ng-template>
                                    </tbody>
                                </table>
                            </div>
                            <ul class="pagination cursor-pointer justify-content-center" *ngIf="searchContactShowing">
                                <li class="page-item" [class.disabled]="currentPageContact == 1">
                                    <a class="page-link custom-link preBtn" (click)="pageChangeContact(1)" aria-label="Previous">
                                        <i class="fa-solid fa-angles-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" [class.disabled]="currentPageContact == 1">
                                    <a
                                        class="page-link custom-link"
                                        (click)="pageChangeContact(currentPageContact - 1)"
                                        aria-label="Previous"
                                    >
                                        <i class="fa-solid fa-angle-left"></i>
                                    </a>
                                </li>
                                <li
                                    *ngFor="let pageContact of pageContacts"
                                    class="page-item"
                                    [class.active]="currentPageContact == pageContact"
                                >
                                    <a class="page-link custom-link" (click)="pageChangeContact(pageContact)">{{ pageContact }}</a>
                                </li>
                                <li class="page-item" [class.disabled]="currentPageContact == totalPages">
                                    <a class="page-link custom-link" (click)="pageChangeContact(currentPageContact + 1)" aria-label="Next">
                                        <i class="fa-solid fa-angle-right"></i>
                                    </a>
                                </li>
                                <li class="page-item" [class.disabled]="currentPageContact == totalpageContacts">
                                    <a
                                        class="page-link custom-link nextBtn"
                                        (click)="pageChangeContact(totalpageContacts)"
                                        aria-label="Next"
                                    >
                                        <i class="fa-solid fa-angles-right"></i>
                                    </a>
                                </li>
                                <li class="page-item ms-3">
                                    <select
                                        class="form-select"
                                        aria-label="Default select example"
                                        [(ngModel)]="pageSizeContact"
                                        (change)="pageSizeChangeContact()"
                                    >
                                        <option
                                            class="dropdown-item"
                                            *ngFor="let optionContact of pageSizeOptionContact"
                                            [value]="optionContact"
                                        >
                                            {{ optionContact }}
                                        </option>
                                    </select>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
