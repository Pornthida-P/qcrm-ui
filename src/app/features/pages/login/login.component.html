<div class="d-flex align-content-center justify-content-around align-items-center min-vh-100 surface-100 p-8">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit(loginForm)">
        <div class="h-100 w-100">
            <div class="border rounded-2 p-5 shadow" style="width: 24rem">
                <div class="row">
                    <div class="col-12 d-flex justify-content-center mb-4">
                        <img src="./assets/qcrm-ui/image/crm_logo.png" class="w-100" />
                    </div>
                    <div class="col-12">
                        <div>
                            <p class="fs-3 text-center">{{ 'login.title' | translate }}</p>
                            <div class="mb-3">
                                <label for="username" class="form-label">{{ 'login.username' | translate }}</label>
                                <input
                                    id="username"
                                    type="text"
                                    formControlName="username"
                                    class="form-control w-100"
                                    [class.is-invalid]="username.invalid && username.touched"
                                    [placeholder]="'login.usernamePlaceholder' | translate"
                                    (input)="filterLoginInput('username', $any($event.target).value)"
                                    required
                                />
                                <div
                                    class="invalid-feedback d-block"
                                    *ngIf="username.invalid && username.touched && username.errors?.['pattern']"
                                >
                                    {{ 'login.usernamePattern' | translate }}
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">{{ 'login.password' | translate }}</label>
                                <div class="position-relative">
                                    <input
                                        id="password"
                                        [type]="showPassword ? 'text' : 'password'"
                                        formControlName="password"
                                        class="form-control w-100"
                                        name="password"
                                        [class.is-invalid]="(password.invalid && password.touched) || showPasswordPatternError"
                                        [placeholder]="'login.passwordPlaceholder' | translate"
                                        (input)="filterLoginInput('password', $any($event.target).value)"
                                    />
                                    <i class="fa-solid fa-eye password-toggle-icon" (click)="togglePassword()" *ngIf="!showPassword"></i>
                                    <i
                                        class="fa-solid fa-eye-slash password-toggle-icon"
                                        (click)="togglePassword()"
                                        *ngIf="showPassword"
                                    ></i>
                                </div>
                                <div
                                    class="invalid-feedback d-block"
                                    *ngIf="(password.invalid && password.touched) || showPasswordPatternError"
                                >
                                    <span *ngIf="password.errors?.['pattern'] || showPasswordPatternError">{{
                                        'login.passwordPattern' | translate
                                    }}</span>
                                </div>
                            </div>

                            <button type="submit" class="border-0 rounded p-2 w-100 btn-primary-color text-white">
                                {{ 'login.submit' | translate }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
