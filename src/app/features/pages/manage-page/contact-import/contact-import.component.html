<div class="container">
    <div class="row g-3 p-3">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="fs-5 m-0">{{ 'title.' + title | translate }}</h2>
                <button type="button" class="btn btn-primary-color text-white" (click)="onClickAdd()">
                    <div class="d-flex gap-1">
                        <fa-icon [icon]="faPlusCircle"></fa-icon>
                        <p class="label">{{ 'page.contact-import.add' | translate }}</p>
                    </div>
                </button>
            </div>
        </div>
        <div class="col-md-12">
            <div class="row">
                <div class="col mb-3">
                    <input
                        type="text"
                        class="form-control"
                        [placeholder]="'page.contact-import.placeHolder' | translate"
                        #inputSearch
                        (input)="onSearch(inputSearch.value)"
                    />
                </div>
            </div>

            <app-table-list
                [title]="title"
                [dataSource]="dataSource"
                [displayedColumns]="displayedColumns"
                [isAction]="isAction"
                [isShowTool]="true"
                (view)="onClickView($event)"
                (edit)="onClickEdit($event)"
                (delete)="onClickDelete($event)"
            ></app-table-list>
        </div>
    </div>
</div>
