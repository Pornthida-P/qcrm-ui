<div class="d-flex flex-column overflow-auto">
    <!-- Filter Section -->
    <div class="row g-3 g-md-4 mb-3 mb-md-4">
        <div class="col-12 col-lg-2">
            <div class="bg-white rounded shadow p-3 p-md-4 h-100">
                <ul class="list-unstyled mb-0">
                    <li *ngFor="let item of menuList" class="mb-2">
                        <a
                            [routerLink]="['/manage-page', item.route]"
                            routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: false }"
                            class="d-flex align-items-center gap-2 text-decoration-none p-2 rounded menu-item"
                        >
                            <!-- <fa-icon [icon]="item.icon" class="menu-icon"></fa-icon> -->
                            <span class="menu-label">{{ item.label | translate }}</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-12 col-lg-10">
            <div class="bg-white rounded shadow p-3 p-md-4 h-100">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
