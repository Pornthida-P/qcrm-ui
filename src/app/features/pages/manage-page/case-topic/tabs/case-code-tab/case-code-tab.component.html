<div class="case-code-tab">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">{{ 'title.' + title | translate }}</h5>
                <button type="button" class="btn btn-primary-color text-white" (click)="onClickAdd()">
                    <div class="d-flex gap-1">
                        <fa-icon [icon]="faPlusCircle"></fa-icon>
                        <p class="label">{{ 'page.case-code.add' | translate }}</p>
                    </div>
                </button>
            </div>
        </div>
        <div class="col-md-12">
            <div class="row">
                <div class="col mb-3">
                    <input
                        type="text"
                        class="form-control"
                        [placeholder]="'page.case-code.placeHolder' | translate"
                        #inputSearch
                        (input)="onSearch(inputSearch.value)"
                    />
                </div>
            </div>

            <app-table-list
                [title]="title"
                [dataSource]="dataSource"
                [displayedColumns]="displayedColumns"
                [isAction]="isAction"
                [isShowTool]="true"
                (view)="onClickView($event)"
                (edit)="onClickEdit($event)"
                (delete)="onClickDelete($event)"
            ></app-table-list>
        </div>
    </div>
</div>
