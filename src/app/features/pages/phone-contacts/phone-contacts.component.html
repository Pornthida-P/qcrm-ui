<div class="h-100">
    <div class="bg-white rounded shadow w-100 h-100 d-flex flex-column p-4 overflow-auto">
        <div class="d-bt-back">
            <button type="button" (click)="prev()" class="btn btn-outline-danger">ย้อนกลับ</button>
            <div class="d-flex flex-row flex-nowrap">
                <button type="button" (click)="submit()" class="btn btn-primary rounded text-white">บันทึก</button>
            </div>
        </div>
        <div class="flex flex-column">
            <p class="mb-3 fs-5">ข้อมูลทั่วไป</p>
            <form class="row g-3 mg-3">
                <div class="col-md-6">
                    <label for="inputContactFirstName" class="form-label">ชื่อ</label>
                    <input
                        type="text"
                        class="form-control"
                        name="contactFirstName"
                        id="inputContactFirstName"
                        [(ngModel)]="contactFirstName"
                    />
                </div>
                <div class="col-md-6">
                    <label for="inputcontactLastName" class="form-label">นามสกุล</label>
                    <input
                        type="text"
                        class="form-control"
                        name="contactLastName"
                        id="inputContactLastName"
                        [(ngModel)]="contactLastName"
                    />
                </div>
                <div class="col-md-6">
                    <label for="inputContactIden" class="form-label">เลขประจำตัว</label>
                    <input type="text" class="form-control" name="contactIden" id="inputContactIden" [(ngModel)]="contactIden" />
                </div>
                <div class="col-md-6">
                    <label for="inputContactOrg" class="form-label">ร้านค้า/บริษัท</label>
                    <div class="col-md-6">
                        <div
                            class="form-control"
                            (click)="showSideBarOrg()"
                            data-bs-toggle="offcanvas"
                            data-bs-target="#offcanvasRight"
                            style="width: 200%; height: 38px; cursor: pointer"
                        >
                            {{ contactOrgName }}
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="inputContactType" class="form-label">ประเภทผู้ประกอบการ</label>
                    <input type="text" class="form-control" name="contactType" id="inputContactType" [(ngModel)]="contactType" />
                </div>
                <div class="col-md-6">
                    <label for="inputContactEmail" class="form-label">อีเมล์</label>
                    <input type="text" class="form-control" name="contactEmail" id="inputContactEmail" [(ngModel)]="contactEmail" />
                </div>
                <div class="col-md-6">
                    <label for="inputContactNum" class="form-label">เบอร์ติดต่อ</label>
                    <input type="text" class="form-control" name="contactNum" id="inputContactNum" [(ngModel)]="contactNumber" />
                </div>
                <div class="col-md-6">
                    <label for="inputContactProvince" class="form-label">จังหวัด</label>
                    <input
                        type="text"
                        class="form-control"
                        name="contactProvince"
                        id="inputContactProvince"
                        [(ngModel)]="contactProvince"
                    />
                </div>
                <div class="col-md-6">
                    <label for="inputContactProductType" class="form-label">ประเภทสินค้า</label>
                    <input
                        type="text"
                        class="form-control"
                        name="contactProductType"
                        id="inputContactProductType"
                        [(ngModel)]="contactProductType"
                    />
                </div>
                <div class="col-md-6">
                    <label for="inputContactSource" class="form-label">แหล่งที่มา</label>
                    <input type="text" class="form-control" name="contactSource" id="inputContactSource" [(ngModel)]="contactSource" />
                </div>
            </form>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <div class="offcanvas-body">
                <div class="d-flex flex-wrap justify-content-between">
                    <div class="d-flex">
                        <div class="p-2 flex-grow-1" type="button" placement="bottom" ngbTooltip="ปิด">
                            <fa-icon class="" [icon]="faCircleXmark" size="lg" data-bs-dismiss="offcanvas"></fa-icon>
                        </div>
                    </div>
                </div>

                <div class="p-5 shadow call-side-detail" *ngIf="SearchOrgShowing">
                    <div>
                        <h4>เลือกร้านค้า/บริษัท</h4>
                        <div class="row">
                            <div class="col-md-8">
                                <input
                                    id="table-complete-search"
                                    type="text"
                                    class="form-control border border-start-0 shadow-none"
                                    name="searchOrg"
                                    [(ngModel)]="valueSearchOrg"
                                    placeholder="ค้นหา..."
                                    aria-describedby="basic-addon1"
                                    style="width: 100%"
                                    (change)="searchOrg()"
                                />
                            </div>
                            <div class="col-md-4 side-org-menu">
                              <button type="button" class="btn btn-primary" (click)="searchOrg()">ค้นหา</button>
                                <button class="btn btn-primary" type="button" (click)="showAddOrg()" style="height: 38px; width: auto;">
                                    เพิ่ม
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-5 shadow call-side-change-by w-100 h-100 overflow-auto p-4" >
                    <div class="table-responsive" *ngIf="SearchOrgShowing">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th style="width: 70%" scope="col">
                                        <a (click)="sortOrg('name')">ชื่อ </a><i *ngIf="sortIdOrg == 'name'" class="{{ sortIcon }}"></i>
                                    </th>
                                    <th style="width: 15%" scope="col">
                                        <a (click)="sortOrg('createdAt')">วันที่บันทึก</a><i *ngIf="sortIdOrg == 'createdAt'" class="{{ sortIcon }}"></i>
                                    </th>
                                    <th style="width: 15%" scope="col">
                                        <a>เลือก</a>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <ng-container *ngIf="organizations?.length > 0; else noDataTemplate">
                                    <tr *ngFor="let org of organizations; let i = index">
                                        <td scope="row">{{ org.name }}</td>
                                        <td scope="row">{{ org.createdAt | date : 'dd/MM/yyyy HH:mm' }}</td>
                                        <td scope="row">
                                            <button type="button" class="btn btn-link rounded-circle" (click)="chooseOrg(org.organizationId)">
                                                <i class="fa-solid fa-check"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </ng-container>
                                <ng-template #noDataTemplate>
                                    <tr>
                                        <td colspan="4" class="text-center">ไม่มีข้อมูล</td>
                                    </tr>
                                </ng-template>
                            </tbody>
                        </table>
                    </div>
                    <ul class="pagination cursor-pointer justify-content-center" *ngIf="SearchOrgShowing">
                        <li class="page-item" [class.disabled]="currentPageOrg == 1">
                            <a class="page-link custom-link preBtn" (click)="pageChangeOrg(1)" aria-label="Previous">
                                <i class="fa-solid fa-angles-left"></i>
                            </a>
                        </li>
                        <li class="page-item" [class.disabled]="currentPageOrg == 1">
                            <a class="page-link custom-link" (click)="pageChangeOrg(currentPageOrg - 1)" aria-label="Previous">
                                <i class="fa-solid fa-angle-left"></i>
                            </a>
                        </li>
                        <li *ngFor="let pageOrg of pageOrgs" class="page-item" [class.active]="currentPageOrg == pageOrg">
                            <a class="page-link custom-link" (click)="pageChangeOrg(pageOrg)">{{ pageOrg }}</a>
                        </li>
                        <li class="page-item" [class.disabled]="currentPageOrg == totalPages">
                            <a class="page-link custom-link" (click)="pageChangeOrg(currentPageOrg + 1)" aria-label="Next">
                                <i class="fa-solid fa-angle-right"></i>
                            </a>
                        </li>
                        <li class="page-item" [class.disabled]="currentPageOrg == totalPageOrgs">
                            <a class="page-link custom-link nextBtn" (click)="pageChangeOrg(totalPageOrgs)" aria-label="Next">
                                <i class="fa-solid fa-angles-right"></i>
                            </a>
                        </li>
                        <li class="page-item ms-3">
                            <select class="form-select" aria-label="Default select example" [(ngModel)]="pageSizeOrg" (change)="pageSizeChangeOrg()">
                                <option class="dropdown-item" *ngFor="let optionOrg of pageSizeOptionOrgs" [value]="optionOrg">{{ optionOrg }}</option>
                            </select>
                        </li>
                    </ul>
                    <button type="button" (click)="showSideBarOrg()" class="btn btn-outline-danger" style="margin-bottom: 5%;" *ngIf="AddOrgShowing">ย้อนกลับ</button>
                    <div class="flex flex-column" *ngIf="AddOrgShowing">
                        <h4>เพิ่มร้านค้า/บริษัท</h4>
                        <form class="mb-3 p-2" style="width: 102.5%; margin-left: -1.5%; margin-bottom: 0%;">
                            <label for="inputOrgName" class="form-label">ชื่อ</label>
                            <div class="input-group">
                                <input
                                    type="text"
                                    class="form-control"
                                    [(ngModel)]="orgName"
                                    name="orgName"
                                    id="inputOrgName"
                                />
                            </div>
                        </form>
                        <form class="mb-3 p-2" style="width: 102.5%; margin-left: -1.5%; margin-top: 3%;">
                            <label for="inputOrgIden" class="form-label">เลขประจำตัว</label>
                            <div class="input-group">
                                <input
                                    type="text"
                                    class="form-control"
                                    [(ngModel)]="orgIden"
                                    name="orgIden"
                                    id="inputOrgIden"
                                />
                            </div>
                        </form>
                        <div class="row">
                            <div class="col-md-6">
                                <label for="inputOrgIndustryType" class="form-label">ประเภทอุตสาหกรรม</label>
                                <select
                                    class="form-select"
                                    [(ngModel)]="orgIndustryType"
                                    name="orgIndustryType"
                                    id="inputOrgIndustryType"
                                >
                                <option *ngFor="let ind of industryType" [value]="ind.industryTypeId">{{ ind.name }}</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="inputOrgProductType" class="form-label">Product Types</label>
                                <select
                                    class="form-select"
                                    [(ngModel)]="orgProductType"
                                    name="orgProductType"
                                    id="inputOrgProductType"
                                >
                                <option *ngFor="let prod of productTypes" [value]="prod.productTypeId">{{ prod.name }}</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary" type="button" (click)="submitOrg()" style="height: 38px; margin-top: 20%;">
                                    บันทึก
                                </button>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
    </div>
</div>
