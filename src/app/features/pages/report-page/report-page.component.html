<div class="h-100">
    <div class="bg-white rounded shadow w-100 h-100 overflow-auto">
        <div class="ps-4 pt-4 d-flex flex-column justify-content-between flex-md-row flex-lg-row gap-4 align-items-center w-100">
            <p class="m-0 d-flex fs-5">{{ 'menuSidebar.report-page' | translate }}</p>
        </div>
        <div class="p-4 d-flex flex-column justify-content-between flex-md-row flex-lg-row gap-4 align-items-center w-100">
            <div class="d-flex flex-nowrap flex-grow-1 gap-2 justify-content-center">
                <!-- <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'channel-by-agent'"
                    (click)="onChangeReport('channel-by-agent')"
                >
                    {{ 'report.channel-by-agent' | translate }}
                </button> -->
                <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'case-type-by-agent'"
                    (click)="onChangeReport('case-type-by-agent')"
                >
                    {{ 'report.case-type-by-agent' | translate }}
                </button>

                <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'case-detail'"
                    (click)="onChangeReport('case-detail')"
                >
                    {{ 'report.case-detail' | translate }}
                </button>
                <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'summary-by-month'"
                    (click)="onChangeReport('summary-by-month')"
                >
                    {{ 'report.summary-by-month' | translate }}
                </button>
                <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'survey-send'"
                    (click)="onChangeReport('survey-send')"
                >
                    {{ 'report.survey-send' | translate }}
                </button>
                <button
                    class="d-flex align-items-center gap-2 d-md-none d-lg-flex btn-primary-color rounded p-2 text-white"
                    [class.button-active]="onSelectReport === 'survey-form'"
                    (click)="onChangeReport('survey-form')"
                >
                    {{ 'report.survey-form' | translate }}
                </button>
            </div>
        </div>
        <router-outlet></router-outlet>
    </div>
