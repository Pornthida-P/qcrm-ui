<div class="p-3">
    <app-chat-subnav active="bot"></app-chat-subnav>
    <div class="bg-white rounded shadow p-4">
        <div class="row g-4">
            <div class="col-lg-4">
                <h6>Categories</h6>
                <div class="input-group mb-2">
                    <input class="form-control" placeholder="Category name" [(ngModel)]="categoryForm.categoryName" />
                    <button class="btn btn-primary" type="button" (click)="saveCategory()">Add</button>
                </div>
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <span class="badge text-bg-secondary p-2" *ngFor="let c of categories">
                        {{ c.categoryName }}
                        <button type="button" class="btn-close btn-close-white btn-close-sm ms-1" (click)="deleteCategory(c.id)"></button>
                    </span>
                </div>

                <h6>Test match</h6>
                <div class="input-group mb-2">
                    <input class="form-control" [(ngModel)]="testText" placeholder="Customer message" (keyup.enter)="testMatch()" />
                    <button class="btn btn-outline-primary" type="button" (click)="testMatch()">Test</button>
                </div>
                <pre class="bg-light p-2 small" *ngIf="testResult">{{ testResult | json }}</pre>
            </div>

            <div class="col-lg-8">
                <h6>Keywords</h6>
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <input class="form-control" placeholder="Keyword" [(ngModel)]="keywordForm.keywordName" />
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" [(ngModel)]="keywordForm.categoryId">
                            <option [ngValue]="null">No category</option>
                            <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.categoryName }}</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input class="form-control" type="number" placeholder="Group id" [(ngModel)]="keywordForm.keywordGroupId" />
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" type="button" (click)="saveKeyword()">Save keyword</button>
                    </div>
                </div>

                <table class="table table-sm mb-4">
                    <thead>
                        <tr>
                            <th>Keyword</th>
                            <th>Group</th>
                            <th>Category</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let k of keywords">
                            <td>{{ k.keywordName }}</td>
                            <td>{{ k.keywordGroupId }}</td>
                            <td>{{ k.categoryName || '-' }}</td>
                            <td>
                                <button class="btn btn-sm btn-link" type="button" (click)="editKeyword(k)">Edit / use group</button>
                                <button class="btn btn-sm btn-link text-danger" type="button" (click)="deleteKeyword(k.id)">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <h6>Responses for group {{ responseForm.keywordGroupId || '-' }}</h6>
                <div class="row g-2 mb-3">
                    <div class="col-md-2">
                        <input class="form-control" type="number" placeholder="Group id" [(ngModel)]="responseForm.keywordGroupId" />
                    </div>
                    <div class="col-md-7">
                        <input class="form-control" placeholder="Response text" [(ngModel)]="responseForm.messageText" />
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" type="button" (click)="saveResponse()">Save response</button>
                    </div>
                </div>

                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>Group</th>
                            <th>Text</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let r of responses">
                            <td>{{ r.keywordGroupId }}</td>
                            <td>{{ r.messageText }}</td>
                            <td>
                                <button class="btn btn-sm btn-link text-danger" type="button" (click)="deleteResponse(r.id)">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
