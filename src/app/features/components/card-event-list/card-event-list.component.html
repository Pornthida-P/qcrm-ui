<div class="px-3">
    <div class="row">
        <div class="col-12 mb-3" *ngIf="isShowTitle">
            <div class="d-flex justify-content-between align-items-center">
                <p class="label fs-5">{{ title }}</p>
                <button *ngIf="isAction && tag" type="button" class="btn btn-primary-color text-white" (click)="onClickAddEvent(tag)">
                    <div class="d-flex gap-2">
                        <fa-icon [icon]="faPlus"></fa-icon>
                        <span class="label">
                            {{ 'component.card-event-list.add' | translate }} {{ tag.tagName}}
                        </span>
                    </div>
                </button>
            </div>
        </div>
        <div class="col-12">
            <div class="container px-5 py-3">
                <div class="row gap-3">
                    <div class="col-12" *ngIf="isShowFilter">
                        <div class="row">
                            <div class="col">
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="ค้นหา {{ tag?.tagName }} "
                                    [(ngModel)]="isFilterSearch"
                                />
                            </div>

                            <div class="col-auto">
                                <select class="form-select" [(ngModel)]="selectedDate" (change)="onSelectDateChange(selectedDate)">
                                    <option value="day">1 {{ 'component.card-event-list.day' | translate }}</option>
                                    <option value="week">1 {{ 'component.card-event-list.week' | translate }}</option>
                                    <option value="month">1 {{ 'component.card-event-list.month' | translate }}</option>
                                    <option value="year">1 {{ 'component.card-event-list.year' | translate }}</option>
                                    <option value="all">
                                        {{ 'component.card-event-list.all' | translate }}
                                    </option>
                                </select>
                            </div>

                            <div class="col-auto">
                                <button type="button" class="btn btn-primary-color text-white" (click)="(onClickFilterAttachment)">
                                    <div class="d-flex align-items-center gap-1">
                                        <input
                                            class="form-check-input m-0 cursor-pointer"
                                            type="checkbox"
                                            id="checkbox-attachment"
                                            [(ngModel)]="isFilterAttachment"
                                        />
                                        <p class="label">
                                            {{ 'component.card-event-list.haveAttachment' | translate }}
                                        </p>
                                    </div>
                                </button>
                            </div>

                            <div class="col-auto">
                                <button type="button" class="btn btn-primary-color text-white" (click)="onClickSort()">
                                    <div class="d-flex gap-1">
                                        <div [ngSwitch]="isFilterSort">
                                            <div *ngSwitchCase="'desc'">
                                                <fa-icon [icon]="faArrowUpShortWide"></fa-icon>
                                            </div>
                                            <div *ngSwitchCase="'asc'">
                                                <fa-icon [icon]="faArrowUpWideShort"></fa-icon>
                                            </div>
                                            <div *ngSwitchDefault>
                                                <fa-icon [icon]="faArrowUpWideShort"></fa-icon>
                                            </div>
                                        </div>
                                        <p class="label">
                                            {{ 'component.card-event-list.sort' | translate }}
                                        </p>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="row gap-3">
                            <div
                                *ngIf="getFilteredEvents().length === 0 || !events || events.length === 0; else eventsContent"
                                class="col-12"
                            >
                                <div class="card">
                                    <div class="card-body">
                                        <p class="card-text text-center p-5">
                                            {{ 'component.card-event-list.noEvent' | translate }} {{ tag?.tagName}}
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <ng-template #eventsContent>
                                <div class="list-group mx-2">
                                    <div
                                        *ngFor="let event of getFilteredEvents()"
                                        class="list-group-item list-group-item-action cursor-pointer"
                                        (click)="onClickViewEvent(event)"
                                    >
                                        <app-event-tag-list [event]="event" [isAction]="true" (isDeleteEvent)="onClickDeleteEvent($event)"></app-event-tag-list>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
