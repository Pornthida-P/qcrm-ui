<div class="vh-100 d-flex flex-column" *ngIf="!searchSidebarVisible">
    <div class="px-3 py-2 bg-white border-bottom border-2 border-light-subtle">
        <div class="d-flex flex-row justify-content-between align-items-center">
            <div class="flex-lg-none d-flex flex-row align-items-center me-lg-6">
                <button
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasNav"
                    aria-controls="offcanvasNav"
                    class="btn px-3 d-sm-flex d-xl-none btn-primary-color text-white rounded"
                >
                    <fa-icon [icon]="faBars"></fa-icon>
                </button>
                <!-- <img src="./assets/qcrm-ui/image/logo_roddonjai.svg" class="nav-img cursor-pointer" [routerLink]="'home'" /> -->
                <img src="./assets/qcrm-ui/image/crm_logo.png" class="nav-img cursor-pointer" [routerLink]="'home'" />
            </div>
            <div class="flex-lg-none d-flex flex-row align-items-center gap-4">
                <div class="dropdown">
                    <button
                        class="btn btn-primary-color text-white dropdown-toggle"
                        type="button"
                        id="dropdownLanguage"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        {{ currentLanguage | uppercase }}
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownLanguage">
                        <li *ngFor="let lang of languages" (click)="changeLanguage(lang.value)">
                            <a class="dropdown-item cursor-pointer">{{ lang.label | uppercase }}</a>
                        </li>
                    </ul>
                </div>

                <div class="d-none d-md-flex d-lg-flex flex-column cursor-default text-end">
                    <p class="m-0 fw-semibold">{{ userData?.username }}</p>
                    <p class="m-0">{{ userData?.role?.roleTitle }}</p>
                </div>
                <div class="dropdown">
                    <div class="d-sm-flex d-md-none">
                        <div class="position-relative" id="dropdownMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="profile-container m-auto cursor-pointer">
                                <img
                                    class="profile-image img-fluid"
                                    [src]="userData?.profile"
                                    [alt]="userData?.username"
                                    (error)="handleProfileError($event)"
                                />
                            </div>
                            <div class="dot">
                                <div
                                    class="dot-inner dot-status"
                                    [ngbTooltip]="getStatusOnline(userData?.userId) ? 'Online' : 'Offline'"
                                    [class.dot-status-online]="getStatusOnline(userData?.userId)"
                                ></div>
                            </div>
                        </div>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenu">
                            <li class="dropdown-item">{{ userData?.username }}</li>
                            <li><hr class="dropdown-divider" /></li>
                            <div *ngFor="let item of menuUser">
                                <li (click)="item.click()">
                                    <a class="dropdown-item cursor-pointer">
                                        <fa-icon [icon]="item.icon" class="pe-2"></fa-icon>
                                        {{ 'menuNavber.' + item.label | translate }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                    <div class="d-none d-md-flex">
                        <div class="position-relative" id="dropdownMenuNoneSm" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="profile-container m-auto cursor-pointer position-relative">
                                <img
                                    class="profile-image img-fluid"
                                    [src]="userData?.profile"
                                    [alt]="userData?.username"
                                    (error)="handleProfileError($event)"
                                />
                            </div>
                            <div class="dot">
                                <div
                                    class="dot-inner dot-status"
                                    [ngbTooltip]="getStatusOnline(userData?.userId) ? 'Online' : 'Offline'"
                                    [class.dot-status-online]="getStatusOnline(userData?.userId)"
                                ></div>
                            </div>
                        </div>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenuNoneSm">
                            <div *ngFor="let item of menuUserNoneSm">
                                <li (click)="item.click()">
                                    <a class="dropdown-item cursor-pointer">
                                        <fa-icon [icon]="item.icon" class="pe-2"></fa-icon>
                                        {{ 'menuNavber.' + item.label | translate }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="h-minus-navbar">
        <div class="h-100 d-flex flex-column flex-lg-row">
            <app-sidebar *ngIf="!hideSidebar"></app-sidebar>
            <div class="p-4 w-100 overflow-scroll">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
