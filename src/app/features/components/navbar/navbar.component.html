<div class="vh-100 d-flex flex-column" *ngIf="!searchSidebarVisible && !notificationSidebarVisible">
    <div class="px-3 py-2 bg-white border-bottom border-2 border-light-subtle">
        <div class="d-flex flex-row justify-content-between align-items-center">
            <div class="flex-lg-none d-flex flex-row align-items-center me-lg-6">
                <button
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasNav"
                    aria-controls="offcanvasNav"
                    class="btn px-3 d-sm-flex d-xl-none btn-primary-color text-white rounded"
                >
                    <fa-icon [icon]="faBars"></fa-icon>
                </button>
                <img src="./assets/nea-qcrm-ui/image/logo_CRM.png" class="nav-img cursor-pointer" [routerLink]="'home'" />
            </div>
            <div class="d-none d-md-flex flex-md-grow-1 ms-md-5 me-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white border border-end-0 color-primary" id="basic-addon1">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input
                        type="text"
                        class="form-control border border-start-0 shadow-none"
                        [(ngModel)]="value"
                        placeholder="ค้นหา..."
                        aria-describedby="basic-addon1"
                        [ngbPopover]="popContentSearch"
                        popoverClass="border rounded popover-search"
                    />
                    <ng-template #popContentSearch>
                        <div class="d-flex flex-column">
                            <p>Result 1</p>
                            <p>Result 2</p>
                            <p>Result 3</p>
                        </div>
                    </ng-template>
                </div>
            </div>
            <div class="flex-lg-none d-flex flex-row align-items-center gap-4">
                <i
                    class="fa-regular fa-bell d-none d-md-flex"
                    id="notification"
                    [ngbPopover]="popContentNotification"
                    popoverClass="border rounded popover-notification"
                ></i>
                <ng-template #popContentNotification>
                    <div class="d-flex flex-column">
                        <p>Notification 1</p>
                        <p>Notification 2</p>
                        <p>Notification 3</p>
                    </div>
                </ng-template>
                <div class="d-none d-md-flex d-lg-flex flex-column cursor-default text-end">
                    <p class="m-0 fw-semibold">{{ userData?.username }}</p>
                    <p class="m-0">{{ userData?.role?.roleTitle }}</p>
                </div>
                <div class="dropdown">
                    <div class="d-sm-flex d-md-none">
                        <div class="position-relative" id="dropdownMenu" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="profile-container m-auto cursor-pointer">
                                <img
                                    class="profile-image img-fluid"
                                    [src]="userData?.profile"
                                    [alt]="userData?.username"
                                    (error)="handleProfileError($event)"
                                />
                            </div>
                            <div class="dot">
                                <div
                                    class="dot-inner dot-status"
                                    [ngbTooltip]="getStatusOnline(userData?.userId) ? 'Online' : 'Offline'"
                                    [class.dot-status-online]="getStatusOnline(userData?.userId)"
                                ></div>
                            </div>
                        </div>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenu">
                            <li class="dropdown-item">{{ userData?.username }}</li>
                            <li><hr class="dropdown-divider" /></li>
                            <div *ngFor="let item of menuUser">
                                <li (click)="item.click()">
                                    <a class="dropdown-item cursor-pointer">
                                        <fa-icon [icon]="item.icon" class="pe-2"></fa-icon>
                                        {{ item.label }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                    <div class="d-none d-md-flex">
                        <div class="position-relative" id="dropdownMenuNoneSm" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="profile-container m-auto cursor-pointer">
                                <img
                                    class="profile-image img-fluid"
                                    [src]="userData?.profile"
                                    [alt]="userData?.username"
                                    (error)="handleProfileError($event)"
                                />
                            </div>
                            <div class="dot">
                                <div
                                    class="dot-inner dot-status"
                                    [ngbTooltip]="getStatusOnline(userData?.userId) ? 'Online' : 'Offline'"
                                    [class.dot-status-online]="getStatusOnline(userData?.userId)"
                                ></div>
                            </div>
                        </div>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenuNoneSm">
                            <div *ngFor="let item of menuUserNoneSm">
                                <li (click)="item.click()">
                                    <a class="dropdown-item cursor-pointer">
                                        <fa-icon [icon]="item.icon" class="pe-2"></fa-icon>
                                        {{ item.label }}
                                    </a>
                                </li>
                            </div>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="h-minus-navbar">
        <div class="h-100 d-flex flex-column flex-lg-row">
            <app-sidebar *ngIf="!hideSidebar"></app-sidebar>
            <div class="p-4 w-100 overflow-scroll">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
<div *ngIf="searchSidebarVisible">
    <div class="vw-100 vh-100 bg-white d-flex flex-column p-3 gap-2">
        <div class="text-end">
            <i class="fa-solid fa-xmark" (click)="closeSearchSideBar()"></i>
        </div>
        <div class="input-group">
            <span class="input-group-text bg-white border border-end-0 color-primary" id="basic-addon1">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
                type="text"
                class="form-control w-100 border border-start-0 shadow-none"
                [(ngModel)]="value"
                placeholder="ค้นหา..."
                aria-describedby="basic-addon1"
            />
        </div>
    </div>
</div>
<div *ngIf="notificationSidebarVisible">
    <div class="vw-100 vh-100 bg-white d-flex flex-column p-3 gap-2">
        <div class="text-end">
            <i class="fa-solid fa-xmark" (click)="closeNotificationSideBar()"></i>
        </div>
        <p class="m-0">การแจ้งเตือน</p>
    </div>
</div>
