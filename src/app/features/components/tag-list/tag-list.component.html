<div class="row">
    <div class="col-12 px-3">
        <div class="row">
            <div class="col">
                <input type="text" class="form-control" placeholder="ค้นหา" #inputSearch (input)="onSearch(inputSearch.value)" />
            </div>

            <div class="col-auto">
                <div class="dropdown">
                    <button
                        class="btn btn-primary dropdown-toggle"
                        type="button"
                        id="dropdownMenuButton"
                        data-bs-toggle="dropdown"
                        aria-haspopup="true"
                        aria-expanded="false"
                    >
                        <fa-icon [icon]="faGear"></fa-icon>
                    </button>
                    <div class="dropdown-menu p-3" aria-labelledby="dropdownMenuButton">
                        <div class="form-check" *ngFor="let column of columnVisibilityKeys">
                            <input
                                class="form-check-input cursor-pointer"
                                type="checkbox"
                                [(ngModel)]="columnVisibility[column]"
                                id="checkbox-{{ column }}"
                            />
                            <span class="form-check-label cursor-default">{{ column }}</span>
                        </div>
                        <button type="button" class="btn btn-primary-color text-white w-100 mt-1" (click)="applyColumnVisibility()">
                            บันทึก
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 py-3">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
            <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
                <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element">
                    <button class="btn color-primary mx-1" (click)="onClickView(element)">
                        <fa-icon [icon]="faEye"></fa-icon>
                    </button>
                    <button *ngIf="isAction" class="btn color-primary mx-1" (click)="onClickEdit(element)">
                        <fa-icon [icon]="faEdit"></fa-icon>
                    </button>
                    <button *ngIf="isAction" class="btn color-red mx-1" (click)="onClickDelete(element)">
                        <fa-icon [icon]="faXmark"></fa-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns.concat('actions')"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns.concat('actions')"></tr>
        </table>
    </div>
</div>
