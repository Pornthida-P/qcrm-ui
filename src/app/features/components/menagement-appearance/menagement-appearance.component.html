<div class="container">
    <div class="row">
        <div class="col-md-12 p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="m-0">Appearance Management</h2>
            </div>
        </div>
        <div class="col-md-12 px-4 pt-2 pb-4">
            <div class="card px-3 py-2">
                <div class="card-body">
                    <div class="row">
                        <div class="col-12">
                            <p class="card-title fs-2">Color Theme</p>
                        </div>
                    </div>
                    <div class="color-palette p-4 d-flex justify-content-center">
                        <div class="color-pair" *ngFor="let pair of colorPairs">
                            <div
                                class="color"
                                [style.background]="getLinearGradient(pair.color1, pair.color2)"
                                (click)="changeTheme(pair.color1, pair.color2)"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
