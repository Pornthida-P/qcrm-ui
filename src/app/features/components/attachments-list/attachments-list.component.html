<div *ngIf="attachments.length === 0" class="row g-2 p-2 justify-content-center align-items-center attachment-container">
    <div class="col-auto m-0 px-3">
        <div class="attachment">
            <p class="fs-7 m-auto">ไม่พบไฟล์แนบ</p>
        </div>
    </div>
</div>
<div *ngFor="let attachment of attachments" class="my-2">
    <app-attachments [attachment]="attachment" [isAction]="isAction" (deleteAttachmentId)="onDeletedAttachment($event)"></app-attachments>
</div>
