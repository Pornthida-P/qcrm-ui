<div *ngIf="event">
    <div
        *ngIf="isNewCard(event.createdAt)"
        class="position-absolute"
        style="width: 25px; height: auto; top: 0; left: 0"
        [style.scale]="isBorder ? '1.2' : '1'"
    >
        <img class="w-100 h-auto" src="assets/nea-qcrm-ui/image/card/pngtree-new-red-ribbon-tag-mark-png-image_4685171.png" alt="" />
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex flex-row">
                <span class="fs-5 me-auto">
                    {{ event.title }}
                </span>
                <div class="d-flex ms-auto">
                    <div class="col-md-12 d-flex justify-content-end gap-2">
                        <span
                            *ngIf="isAction"
                            class="fs-6 color-primary cursor-pointer"
                            style="z-index: 99"
                            (click)="onClickEditEvent(event)"
                        >
                            <fa-icon [icon]="faEdit"></fa-icon>
                        </span>
                        <span
                            *ngIf="isAction"
                            class="fs-6 color-red cursor-pointer"
                            style="z-index: 99"
                            (click)="onClickDeleteEvent(event)"
                        >
                            <fa-icon [icon]="faTrash"></fa-icon>
                        </span>
                        <span *ngIf="event.attachments.length > 0; else disable" class="color-primary" style="font-size: 11pt">
                            <fa-icon [icon]="faPaperclip"></fa-icon>
                        </span>
                        <ng-template #disable>
                            <span class="color-secondary opacity-25" style="font-size: 11pt">
                                <fa-icon [icon]="faPaperclip"></fa-icon>
                            </span>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-row justify-content-between">
                
                <span class="text-secondary" style="font-size: 10pt">{{ event.username }}</span>
                <span class="text-secondary" style="font-size: 10pt">{{ event.createdAt | date : 'medium' }}</span>
            </div>
        </div>
    </div>
</div>
