<div class="p-3">
    <div class="row">
        <div class="col-12 mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <p class="label fs-5">{{ title }}</p>
                <button type="button" class="btn btn-primary-color text-white" (click)="onClickAddEvent()">
                    <div class="d-flex gap-2">
                        <fa-icon [icon]="faPlus"></fa-icon>
                        <span class="label">เพิ่ม</span>
                    </div>
                </button>
            </div>
        </div>
        <div class="calendar col-sm-12 col-md-6">
            <app-calendar-preview [events]="calendarDateEvents" (selectedDate)="onSelectDate($event)"></app-calendar-preview>
        </div>
        <div class="events col-sm-12 col-md-6 overflow-auto">
            <div class="position-relative">
                <div class="position-absolute w-100">
                    <div *ngIf="selectedCalendarDate">
                        <div *ngIf="!events || events.length === 0; else eventsContent">
                            <div class="card">
                                <div class="card-body">
                                    <p class="card-text text-center p-5">ไม่มี Event</p>
                                </div>
                            </div>
                        </div>
                        <ng-template #eventsContent>
                            <div *ngFor="let event of events" class="d-flex flex-column gap-3">
                                <app-calendar-card [event]="event"></app-calendar-card>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
