<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef class="fs-6 fw-bolder">{{ 'table.' + title + '.' + column | translate }}</th>
        <td mat-cell *matCellDef="let element">
            <ng-container [ngSwitch]="true">
                <ng-container *ngSwitchCase="includesProfile.includes(column)">
                    <div class="col-auto">
                        <div class="position-relative m-auto">
                            <div class="profile-container">
                                <img class="profile-image" [src]="element[column]" (error)="handleProfileError($event)" #imageElement />
                            </div>
                        </div>
                    </div>
                </ng-container>

                <ng-container *ngSwitchCase="includesStatus.includes(column)">
                    <div class="dot">
                        <div
                            class="dot-inner dot-status"
                            [ngbTooltip]="getStatusOnline(element.userId) ? 'Online' : 'Offline'"
                            [class.dot-status-online]="getStatusOnline(element.userId)"
                        ></div>
                    </div>
                </ng-container>

                <ng-container *ngSwitchCase="includesDate.includes(column)">
                    <p class="label">{{ element[column] | date : 'dd/MM/yyyy HH:mm:ss' }}</p>
                </ng-container>

                <ng-container *ngSwitchCase="includesRole.includes(column)">
                    <p class="label">{{ element[column].roleTitle }}</p>
                </ng-container>

                <ng-container *ngSwitchCase="includesColor.includes(column)">
                    <p class="label" [style.color]="element[column]">{{ element[column] }}</p>
                </ng-container>

                <ng-container *ngSwitchDefault>
                    <p class="label">{{ element[column] }}</p>
                </ng-container>
            </ng-container>
        </td>
    </ng-container>

    <ng-container *ngIf="isShowTool" matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="fs-6 fw-bolder">{{ 'table.Actions' | translate }}</th>
        <td mat-cell *matCellDef="let element">
            <button class="btn color-primary mx-1" (click)="onClickView(element)">
                <fa-icon [icon]="faEye"></fa-icon>
            </button>
            <button *ngIf="isAction" class="btn color-primary mx-1" (click)="onClickEdit(element)">
                <fa-icon [icon]="faEdit"></fa-icon>
            </button>
            <button *ngIf="isAction" class="btn color-red mx-1" (click)="onClickDelete(element)">
                <fa-icon [icon]="faTrash"></fa-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="isShowTool ? displayedColumns.concat('actions') : displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: isShowTool ? displayedColumns.concat('actions') : displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"> ></mat-paginator>
