<div class="container">
    <div class="row">
        <div class="col-md-12 p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="m-0">Account Management</h2>
            </div>
        </div>
        <div class="col-md-7 px-4 pt-2 pb-4">
            <form>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="username">Username</label>
                    <input type="text" class="form-control" id="username" [(ngModel)]="userData.username" name="username" required />
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="role">Role</label>
                    <input type="text" class="form-control" id="role" [(ngModel)]="userData.role" name="role" required />
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="email">Email</label>
                    <input type="email" class="form-control" id="email" [(ngModel)]="userData.email" name="email" required />
                </div>
                <div class="text-center px-3 py-2">
                    <button type="submit" class="btn btn-primary-color w-100 text-white">Save</button>
                </div>
            </form>
        </div>
        <div class="col-md-5 px-4 pt-2 pb-4">
            <div class="card avatar h-100 py-3">
                <div class="profile cursor-pointer">
                    <img
                        class="profile-image img-fluid"
                        [src]="userData.profile"
                        [alt]="userData.username"
                        (error)="handleProfileError($event)"
                    />
                </div>
                <div class="text-center px-3 py-2">
                    <p class="m-1">Public avatar</p>
                    <button type="button" class="btn btn-primary-color text-white m-1">Upload</button>
                    <p class="fs-6 m-1">
                        <small>JPG, GIF or PNG 400x400, &lt; 2 MB.</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
