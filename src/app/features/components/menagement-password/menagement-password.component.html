<div class="container">
    <div class="row g-3 p-3">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="fs-5 m-0">{{ title }}</h2>
                <div style="min-height: 36px"></div>
            </div>
        </div>
        <div class="col-md-12">
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="currentPassword">รหัสผ่านปัจจุบัน</label>
                    <input
                        type="password"
                        class="form-control"
                        id="currentPassword"
                        formControlName="currentPassword"
                        name="currentPassword"
                        required
                        [ngClass]="{
                            'invalid-form':
                                (passwordForm.get('currentPassword')?.dirty || passwordForm.get('currentPassword')?.touched) &&
                                passwordForm.get('currentPassword')?.invalid
                        }"
                    />
                    <div
                        *ngIf="
                            passwordForm.get('currentPassword')?.invalid &&
                            (passwordForm.get('currentPassword')?.dirty || passwordForm.get('currentPassword')?.touched)
                        "
                        class="fs-8 pt-2 text-danger"
                    >
                        รหัสผ่านปัจจุบันจำเป็นต้องกรอก
                    </div>
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="newPassword">รหัสผ่านใหม่</label>
                    <input
                        type="password"
                        class="form-control"
                        id="newPassword"
                        formControlName="newPassword"
                        name="newPassword"
                        required
                        [ngClass]="{
                            'invalid-form':
                                (passwordForm.get('newPassword')?.dirty || passwordForm.get('newPassword')?.touched) &&
                                passwordForm.get('newPassword')?.invalid
                        }"
                    />
                    <div
                        *ngIf="
                            passwordForm.get('newPassword')?.invalid &&
                            (passwordForm.get('newPassword')?.dirty || passwordForm.get('newPassword')?.touched)
                        "
                        class="fs-8 pt-2 text-danger"
                    >
                        รหัสผ่านใหม่จำเป็นต้องกรอก และมีความยาวอย่างน้อย 8 ตัวอักษร
                    </div>
                </div>
                <div class="form-group px-3 py-2">
                    <label class="mb-2" for="verifyPassword">ยืนยันรหัสผ่านใหม่</label>
                    <input
                        type="password"
                        class="form-control"
                        id="verifyPassword"
                        formControlName="verifyPassword"
                        name="verifyPassword"
                        required
                        [ngClass]="{
                            'invalid-form':
                                (passwordForm.get('verifyPassword')?.dirty || passwordForm.get('verifyPassword')?.touched) &&
                                passwordForm.get('verifyPassword')?.invalid
                        }"
                    />
                    <div
                        *ngIf="
                            passwordForm.get('verifyPassword')?.invalid &&
                            (passwordForm.get('verifyPassword')?.dirty || passwordForm.get('verifyPassword')?.touched)
                        "
                        class="fs-8 pt-2 text-danger"
                    >
                        รหัสผ่านยืนยันจำเป็นต้องกรอก
                    </div>
                </div>
                <div class="text-center px-3 py-2">
                    <button type="submit" class="btn btn-primary-color w-100 text-white" [disabled]="passwordForm.invalid">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
